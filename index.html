<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>شطرنج غیرممکن — با قوی‌ترین ربات شطرنج دنیا بازی کن</title>
  <meta name="description" content="شطرنج آنلاین و رایگان با Stockfish، قوی‌ترین موتور شطرنج جهان. از سطح مبتدی تا «غیرممکن» — آیا می‌توانی ببری؟">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<!-- SVG piece sprites -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="p-p" viewBox="0 0 100 100">
      <circle cx="50" cy="29" r="12"/>
      <path d="M41 43h18q1 17 9 31H32q8-14 9-31z"/>
      <path d="M26 88h48v-6q0-8-8-8H34q-8 0-8 8z"/>
    </symbol>
    <symbol id="p-r" viewBox="0 0 100 100">
      <path d="M26 16h13v10h5V16h12v10h5V16h13v24l-8 7v21l8 7v10H26V75l8-7V47l-8-7z"/>
      <path d="M34 47h32M34 68h32" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M22 88h56v-5q0-6-6-6H28q-6 0-6 6z"/>
    </symbol>
    <symbol id="p-n" viewBox="0 0 100 100">
      <path d="M26 86c0-22 5-34 15-44-7 0-14 4-20 12-4-5-1-12 5-22l12-14 1-9 9 8c20 1 38 18 38 69z"/>
      <circle cx="50" cy="32" r="3.2" fill="currentColor" stroke="none"/>
      <path d="M26 48l8-3m-3 15c5-3 8-8 10-14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="p-b" viewBox="0 0 100 100">
      <circle cx="50" cy="13" r="6"/>
      <path d="M50 20c18 12 22 28 11 42 5 2 9 5 9 9H30c0-4 4-7 9-9C28 48 32 32 50 20z"/>
      <path d="M44 36l12 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M26 88h48v-4q0-8-9-8H35q-9 0-9 8z"/>
    </symbol>
    <symbol id="p-q" viewBox="0 0 100 100">
      <path d="M26 76 17 32l15 22 4-30 10 28 4-34 4 34 10-28 4 30 15-22-9 44z"/>
      <circle cx="17" cy="28" r="5"/><circle cx="36" cy="19" r="5"/><circle cx="50" cy="13" r="5"/><circle cx="64" cy="19" r="5"/><circle cx="83" cy="28" r="5"/>
      <path d="M26 88h48v-5q0-7-7-7H33q-7 0-7 7z"/>
    </symbol>
    <symbol id="p-k" viewBox="0 0 100 100">
      <path d="M46 6h8v7h7v8h-7v7h-8v-7h-7v-8h7z"/>
      <path d="M50 30c20 0 28 16 24 32-1 6 3 10 5 14H21c2-4 6-8 5-14-4-16 4-32 24-32z"/>
      <path d="M36 58h28" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M24 88h52v-5q0-7-7-7H31q-7 0-7 7z"/>
    </symbol>
  </defs>
</svg>

<header class="topbar">
  <a class="brand" href="./" aria-label="home">
    <svg viewBox="0 0 100 100" class="brand-mark" aria-hidden="true"><rect width="100" height="100" rx="24" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><g transform="translate(14 12) scale(.72)" fill="#fff" stroke="#0b1020" stroke-width="4" stroke-linejoin="round"><use href="#p-n" width="100" height="100"/></g></svg>
    <span class="brand-name" data-i18n="brand">شطرنج غیرممکن</span>
  </a>
  <div class="top-actions">
    <span class="engine-badge" id="engineBadge" data-state="loading"><i></i><span id="engineBadgeText">…</span></span>
    <button class="icon-btn" id="btnSound" title="Sound" aria-label="Sound"></button>
    <button class="icon-btn txt" id="btnLang" title="Language">EN</button>
  </div>
</header>

<main class="layout">
  <section class="play" aria-label="board">
    <div class="player" id="topPlayer">
      <div class="avatar" id="topAvatar"></div>
      <div class="pinfo"><b id="topName"></b><small id="topSub"></small></div>
      <div class="captured" id="topCaptured"></div>
      <div class="clock" id="topClock">--:--</div>
    </div>

    <div class="boardrow">
      <div class="evalbar" id="evalBar" title="Evaluation">
        <div class="eval-fill" id="evalFill"></div>
        <span class="eval-label" id="evalLabel">0.0</span>
      </div>
      <div class="board-shell">
        <div class="board" id="board" data-theme="ocean"></div>
        <svg class="arrows" id="arrows" viewBox="0 0 800 800" aria-hidden="true">
          <defs><marker id="ah" markerWidth="4" markerHeight="4" refX="2.4" refY="2" orient="auto"><path d="M0 0L4 2 0 4z" fill="#22d3ee"/></marker></defs>
        </svg>
        <div class="thinking" id="thinking" hidden><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="player" id="botPlayer">
      <div class="avatar" id="botAvatar"></div>
      <div class="pinfo"><b id="botName"></b><small id="botSub"></small></div>
      <div class="captured" id="botCaptured"></div>
      <div class="clock" id="botClock">--:--</div>
    </div>
  </section>

  <aside class="side">
    <div class="card status-card">
      <div class="status" id="statusText"></div>
      <div class="opening" id="openingName"></div>
    </div>

    <div class="card moves-card">
      <div class="card-title"><span data-i18n="moves">حرکات</span>
        <svg class="graph" id="evalGraph" viewBox="0 0 120 28" preserveAspectRatio="none"></svg>
      </div>
      <ol class="movelist" id="moveList"></ol>
    </div>

    <div class="card actions">
      <button class="btn primary wide" id="btnNew" data-i18n="newGame">بازی جدید</button>
      <div class="btn-grid">
        <button class="btn" id="btnUndo"><span data-i18n="undo">برگشت</span></button>
        <button class="btn" id="btnHint"><span data-i18n="hint">راهنمایی</span></button>
        <button class="btn" id="btnFlip"><span data-i18n="flip">چرخاندن</span></button>
        <button class="btn" id="btnDraw"><span data-i18n="draw">پیشنهاد تساوی</span></button>
        <button class="btn danger" id="btnResign"><span data-i18n="resign">تسلیم</span></button>
        <button class="btn" id="btnPgn"><span data-i18n="copyPgn">کپی PGN</span></button>
      </div>
    </div>

    <details class="card settings">
      <summary data-i18n="settings">تنظیمات</summary>
      <label class="row"><span data-i18n="boardTheme">رنگ صفحه</span>
        <select id="selTheme">
          <option value="ocean">Ocean</option><option value="wood">Classic</option>
          <option value="emerald">Emerald</option><option value="slate">Slate</option><option value="rose">Rose</option>
        </select></label>
      <label class="row"><span data-i18n="showLegal">نمایش حرکات مجاز</span><input type="checkbox" id="chkLegal" checked></label>
      <label class="row"><span data-i18n="autoQueen">ارتقای خودکار به وزیر</span><input type="checkbox" id="chkAutoQueen"></label>
      <label class="row col"><span><span data-i18n="thinkTime">زمان فکر ربات در سطح غیرممکن</span>: <b id="thinkTimeVal">3</b>s</span>
        <input type="range" id="rngThink" min="1" max="15" value="3"></label>
    </details>

    <p class="engine-err" id="engineErr" hidden dir="ltr"></p>
    <p class="foot" data-i18n-html="footer"></p>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- New game dialog -->
<dialog id="dlgNew">
  <form method="dialog" id="frmNew">
    <h2 data-i18n="newGame">بازی جدید</h2>
    <h3 data-i18n="chooseLevel">سطح ربات</h3>
    <div class="levels" id="levelList"></div>
    <div class="two">
      <div>
        <h3 data-i18n="chooseColor">رنگ تو</h3>
        <div class="seg" id="segColor">
          <button type="button" data-v="w" class="on" data-i18n="white">سفید</button>
          <button type="button" data-v="r" data-i18n="random">تصادفی</button>
          <button type="button" data-v="b" data-i18n="black">سیاه</button>
        </div>
      </div>
      <div>
        <h3 data-i18n="timeControl">ساعت</h3>
        <select id="selTime">
          <option value="0">∞</option><option value="1+0">1 + 0</option><option value="3+0">3 + 0</option>
          <option value="3+2">3 + 2</option><option value="5+0">5 + 0</option><option value="10+0">10 + 0</option><option value="15+10">15 + 10</option>
        </select>
      </div>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="btnNewCancel" data-i18n="cancel">انصراف</button>
      <button type="submit" class="btn primary" id="btnStart" data-i18n="start">شروع بازی</button>
    </div>
  </form>
</dialog>

<!-- Promotion -->
<dialog id="dlgPromo">
  <h3 data-i18n="promoteTo">ارتقا به</h3>
  <div class="promo" id="promoChoices"></div>
</dialog>

<!-- Game over -->
<dialog id="dlgOver">
  <div class="over">
    <div class="over-emoji" id="overEmoji"></div>
    <h2 id="overTitle"></h2>
    <p id="overText"></p>
    <div class="over-stats" id="overStats"></div>
    <div class="dlg-actions">
      <button class="btn" id="btnOverPgn" data-i18n="downloadPgn">دانلود PGN</button>
      <button class="btn" id="btnOverClose" data-i18n="review">بررسی بازی</button>
      <button class="btn primary" id="btnRematch" data-i18n="playAgain">بازی دوباره</button>
    </div>
  </div>
</dialog>

<script src="js/config.js?v=3"></script>
<script src="js/chess-core.js?v=3"></script>
<script src="js/i18n.js?v=3"></script>
<script src="js/engine.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
